<body>
  <section>
    <div class="container-fluid">
      <div
        id="mainContentCarousel"
        class="carousel slide"
        data-bs-ride="carousel"
      >
        <div class="carousel-inner" style="border-radius: 0.5rem">
          <!-- img 1 -->
          <div class="carousel-item active">
            <img
              src="../../src/imgs/carrosel_1.jpg"
              class="d-none d-lg-block w-100"
              alt="carrosel_1"
            />
            <img
              src="../../src/imgs/carrosel_1_mobile.jpg"
              class="d-block d-lg-none w-100"
              alt="carrosel_1_mobile"
            />
          </div>

          <!-- img 2 -->
          <div class="carousel-item">
            <img
              src="../../src/imgs/carrosel_2.jpg"
              class="d-none d-lg-block w-100"
              alt="carrosel_2"
            />
            <img
              src="../../src/imgs/carrosel_2_mobile.jpg"
              class="d-block d-lg-none w-100"
              alt="carrosel_2_mobile"
            />
          </div>

          <!-- img 3 -->
          <div class="carousel-item">
            <img
              src="../../src/imgs/carrosel_3.jpg"
              class="d-none d-lg-block w-100"
              alt="carrosel_3"
            />
            <img
              src="../../src/imgs/carrosel_3_mobile.jpg"
              class="d-block d-lg-none w-100"
              alt="carrosel_3_mobile"
            />
          </div>
        </div>
        <button
          class="carousel-control-prev"
          type="button"
          data-bs-target="#mainContentCarousel"
          data-bs-slide="prev"
        >
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button
          class="carousel-control-next"
          type="button"
          data-bs-target="#mainContentCarousel"
          data-bs-slide="next"
        >
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>
    </div>
  </section>
</body>
